# fzf-cliphist tmux configuration
# Add these options to your tmux.conf or source this file

# ===========================================
# Key Binding
# ===========================================
# Key to trigger fzf-cliphist popup (default: M-h)
set -g @fzf-cliphist-bind "M-h"
# Key Binding
# ===========================================
# Key to trigger fzf-cliphist popup (default: C-h)
# Key to trigger fzf-cliphist popup (default: C-b \)
# Note: C-h is already used in some configs. Use with prefix or change prefix.
# Examples:
#   set -g prefix C-b     (default)
#   set -g prefix2 C-a    (add second prefix)
set -g @fzf-cliphist-bind "\\"

# ===========================================
# Popup Dimensions
# ===========================================
# Popup width (default: 80%)
set -g @fzf-cliphist-width "80%"

# Popup height (default: 80%)
set -g @fzf-cliphist-height "80%"

# ===========================================
# FZF Options
# ===========================================
# fzf preview window (default: right:50%:wrap)
set -g @fzf-cliphist-preview-window "right:50%:wrap"

# fzf header (default: "Enter: Copy | Ctrl-Y: Copy (no exit) | Ctrl-P: Toggle preview")
set -g @fzf-cliphist-header "Enter: Copy | Ctrl-Y: Copy (no exit) | Ctrl-P: Toggle preview"

# fzf color scheme - Tokyo Night (default)
set -g @fzf-cliphist-color "fg:#c0caf5,bg:#1a1b26,hl:#e0af68,fg+:#c0caf5,bg+:#292e42,hl+:#e0af68,info:#7aa2f7"

# ===========================================
# Installation (add to your tmux.conf):
# ===========================================
# Run TPM plugin or source directly:
#
# Using TPM:
#   set -g @plugin 'your-repo/fzf-cliphist'
#
# Or source directly:
#   source-file /path/to/fzf-cliphist.tmux
#
# Then reload tmux config:
#   tmux source-file ~/.tmux.conf
